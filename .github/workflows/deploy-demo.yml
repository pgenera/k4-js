name: Deploy k4-js Static Demo to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp build info
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/commit: '[^']*'/commit: '${COMMIT}'/" web/js/util/build-info.js
          sed -i "s/builtAt: '[^']*'/builtAt: '${BUILT_AT}'/" web/js/util/build-info.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
