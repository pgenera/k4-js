# Envoy 1.39.1 configuration snippet for Elecraft K4 Web Observatory
# Matches vhost layout for k4.example.com:
# - Static assets served from /var/www/k4 via envoy.filters.http.file_server
# - /ws upgraded to WebSocket and proxied to local k4-websockify / k4-websocat (127.0.0.1:9280)
#
# Merge the virtual_host, http_filters, and cluster below into /etc/envoy.yaml
# (or run standalone with TLS listener configured for your certificate paths).

static_resources:
  listeners:
    - name: k4_https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: k4_ingress_https
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: k4_routes
                  virtual_hosts:
                    - name: k4_example_com
                      domains:
                        - "k4.example.com"
                        - "k4.example.com:443"
                      routes:
                        # 1. WebSocket bridge endpoint (/ws -> 127.0.0.1:9280)
                        - match:
                            prefix: "/ws"
                          route:
                            cluster: k4_ws_bridge
                            timeout: 0s
                            idle_timeout: 3600s
                            upgrade_configs:
                              - upgrade_type: websocket
                        # 2. Static web root served directly by Envoy file_server
                        - match:
                            prefix: "/"
                          route:
                            cluster: k4_static_noop
                          typed_per_route:
                            envoy.filters.http.file_server:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.file_server.v3.FileServerConfig
                              manager_config:
                                thread_pool:
                                  thread_count: 2
                              path_mappings:
                                - request_path_prefix: "/"
                                  file_path_prefix: "/var/www/k4"
                              directory_behaviors:
                                - default_file: "index.html"
                http_filters:
                  - name: envoy.filters.http.file_server
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.file_server.v3.FileServerConfig
                      manager_config:
                        thread_pool:
                          thread_count: 2
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # transport_socket:
      #   name: envoy.transport_sockets.tls
      #   typed_config:
      #     "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
      #     common_tls_context:
      #       tls_certificates:
      #         - certificate_chain: { filename: "/etc/letsencrypt/live/k4.example.com/fullchain.pem" }
      #           private_key: { filename: "/etc/letsencrypt/live/k4.example.com/privkey.pem" }

  clusters:
    - name: k4_ws_bridge
      connect_timeout: 2s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: k4_ws_bridge
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9280

    # Dummy cluster referenced by static route before file_server short-circuits the response
    - name: k4_static_noop
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: k4_static_noop
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9280
