<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="k4BgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#111C2D"/>
      <stop offset="65%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#090B10"/>
    </radialGradient>
    <linearGradient id="k4SpecFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="k4WfBand1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="30%" stop-color="#0E4A6F"/>
      <stop offset="52%" stop-color="#38BDF8"/>
      <stop offset="62%" stop-color="#F97316"/>
      <stop offset="72%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="k4WfBand2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="22%" stop-color="#0C3554"/>
      <stop offset="50%" stop-color="#1E88C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="74%" stop-color="#0C3554"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="k4CyanGlow" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed dark obsidian background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#k4BgGlow)"/>

  <!-- Subtle instrument frame -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="3"/>

  <!-- Faint graticule lines -->
  <line x1="64" y1="264" x2="448" y2="264" stroke="rgba(148,163,184,0.12)" stroke-width="1.5"/>
  <line x1="64" y1="316" x2="448" y2="316" stroke="rgba(148,163,184,0.12)" stroke-width="1.5"/>
  <line x1="256" y1="224" x2="256" y2="366" stroke="rgba(56,189,248,0.16)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Bold K4 Monogram in upper-middle safe zone -->
  <text x="256" y="206"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="146"
        font-weight="800"
        letter-spacing="-4"
        fill="#F1F5F9">K4</text>

  <!-- RF Spectrum area fill -->
  <path d="M 64 358
           L 108 352
           L 132 344
           L 150 353
           L 184 346
           L 202 322
           L 216 346
           L 246 348
           L 262 326
           L 276 348
           L 292 342
           L 308 242
           L 322 338
           L 348 349
           L 382 334
           L 398 351
           L 448 356
           L 448 370
           L 64 370 Z"
        fill="url(#k4SpecFill)"/>

  <!-- RF Spectrum glowing cyan trace -->
  <path d="M 64 358
           L 108 352
           L 132 344
           L 150 353
           L 184 346
           L 202 322
           L 216 346
           L 246 348
           L 262 326
           L 276 348
           L 292 342
           L 308 242
           L 322 338
           L 348 349
           L 382 334
           L 398 351
           L 448 356"
        fill="none"
        stroke="#38BDF8"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#k4CyanGlow)"/>

  <!-- Peak marker dot (#F97316 orange TX/peak dot) -->
  <circle cx="308" cy="242" r="14" fill="rgba(249,115,22,0.28)"/>
  <circle cx="308" cy="242" r="8" fill="#F97316" stroke="#090B10" stroke-width="2.5"/>

  <!-- Horizontal obsidian-to-cyan waterfall band accents at bottom -->
  <rect x="64" y="384" width="384" height="10" rx="5" fill="url(#k4WfBand1)"/>
  <rect x="82" y="402" width="348" height="8" rx="4" fill="url(#k4WfBand2)" opacity="0.92"/>
  <rect x="108" y="418" width="296" height="6" rx="3" fill="url(#k4WfBand2)" opacity="0.65"/>
</svg>
