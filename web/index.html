<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>K4 Spectrum Observatory · RX</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script defer src="js/util/events.js"></script>
  <script defer src="js/util/storage.js"></script>
  <script defer src="js/protocol/sha384.js"></script>
  <script defer src="js/protocol/framer.js"></script>
  <script defer src="js/protocol/cat-codec.js"></script>
  <script defer src="js/protocol/binary-packets.js"></script>
  <script defer src="js/transport/rx-only-gate.js"></script>
  <script defer src="js/state/radio-state.js"></script>
  <script defer src="js/transport/k4-client.js"></script>
  <script defer src="js/panadapter/band-plan.js"></script>
  <script defer src="js/panadapter/color-luts.js"></script>
  <script defer src="js/panadapter/dsp.js"></script>
  <script defer src="js/panadapter/webgl-renderer.js"></script>
  <script defer src="js/panadapter/interaction.js"></script>
  <script defer src="js/panadapter/panadapter-view.js"></script>
  <script defer src="js/audio/pcm-decoder.js"></script>
  <script defer src="js/audio/opus-decoder.js"></script>
  <script defer src="js/audio/worklet-source.js"></script>
  <script defer src="js/audio/audio-engine.js"></script>
  <script defer src="js/ui/vfo-widget.js"></script>
  <script defer src="js/ui/smeter-widget.js"></script>
  <script defer src="js/ui/omnibar.js"></script>
  <script defer src="js/ui/inspector-panels.js"></script>
  <script defer src="js/ui/connection-dialog.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="app-shell">
    <header id="top-bar" role="banner">
      <div class="k4-topbar-left">
        <button type="button" id="conn-btn" class="k4-conn-pill" data-testid="conn-btn" data-status="disconnected" title="Connection settings">
          <span class="k4-status-dot" aria-hidden="true"></span>
          <span class="k4-conn-label">Disconnected</span>
          <span class="k4-conn-rtt" aria-label="Round trip time"></span>
        </button>

        <div id="vfo-a-mount" class="k4-vfo-slot" data-testid="vfo-a"></div>
      </div>

      <div class="k4-topbar-center">
        <div id="smeter-mount" class="k4-smeter-slot" data-testid="smeter"></div>
        <div id="vfo-b-mount" class="k4-vfo-slot k4-vfo-slot--sub" data-testid="vfo-b"></div>
      </div>

      <div class="k4-topbar-right">
        <button type="button" id="omnibar-btn" class="k4-action-btn k4-omnibar-trigger" data-testid="omnibar-btn" title="Quick jump &amp; commands (Cmd/Ctrl+K)">
          <svg class="k4-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.7 10.7L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="k4-btn-label">Jump</span>
          <kbd class="k4-kbd-hint">⌘K</kbd>
        </button>

        <button type="button" id="audio-toggle" class="k4-action-btn k4-audio-btn" data-testid="audio-toggle" data-state="off" title="Start or mute receiver audio (M)">
          <svg class="k4-icon k4-audio-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M2.5 6.2H5.2L8.8 3.2V12.8L5.2 9.8H2.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path class="k4-audio-waves" d="M11 5.5C11.9 6.3 12.4 7.1 12.4 8C12.4 8.9 11.9 9.7 11 10.5M12.8 3.8C14.1 5 14.8 6.4 14.8 8C14.8 9.6 14.1 11 12.8 12.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path class="k4-audio-slash" d="M11 6L14.5 10M14.5 6L11 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="k4-audio-label">Audio Off</span>
        </button>

        <span id="rx-only-badge" class="k4-rx-badge" data-testid="rx-only-badge" title="Receive-only firewall active: all transmit, tune, keyer, and power commands are blocked client-side.">
          <svg class="k4-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <rect x="3.5" y="7" width="9" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M5.5 7V5.2A2.5 2.5 0 0 1 10.5 5.2V7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="k4-rx-badge-text">RX ONLY</span>
          <span class="k4-rx-blocked-count" hidden>0</span>
        </span>

        <button type="button" id="drawer-toggle" class="k4-icon-btn k4-drawer-toggle" data-testid="drawer-toggle" aria-expanded="true" title="Toggle Inspector Drawer">
          <svg class="k4-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <line x1="10" y1="2.5" x2="10" y2="13.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="workspace">
      <section id="pan-stage" aria-label="Spectrum Panadapter and Waterfall"></section>
      <aside id="inspector-drawer" class="k4-drawer" data-testid="inspector-drawer" data-open="true" aria-label="Receiver Inspector"></aside>
    </main>

    <nav id="mobile-nav" class="k4-mobile-nav" data-testid="mobile-nav" aria-label="Mobile Controls"></nav>
  </div>

  <section id="mobile-sheet" class="k4-mobile-sheet" data-testid="mobile-sheet" data-open="false" aria-hidden="true" aria-label="Receiver Control Sheet"></section>
  <div id="omnibar-modal" class="k4-modal-backdrop" data-testid="omnibar-modal" data-open="false" hidden></div>
  <div id="connection-dialog" class="k4-modal-backdrop" data-testid="conn-dialog" data-open="false" hidden></div>
  <div id="toast-stack" class="k4-toast-stack" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
