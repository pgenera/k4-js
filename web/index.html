<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090B10">
  <meta name="application-name" content="K4 Radio">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K4 Radio">
  <title>K4 Spectrum Observatory · RX</title>
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script defer src="js/util/events.js"></script>
  <script defer src="js/util/build-info.js"></script>
  <script defer src="js/util/storage.js"></script>
  <script defer src="js/util/pwa.js"></script>
  <script defer src="js/protocol/sha384.js"></script>
  <script defer src="js/protocol/framer.js"></script>
  <script defer src="js/protocol/cat-codec.js"></script>
  <script defer src="js/protocol/binary-packets.js"></script>
  <script defer src="js/transport/rx-only-gate.js"></script>
  <script defer src="js/state/radio-state.js"></script>
  <script defer src="js/demo/ddc-demod.js"></script>
  <script defer src="js/demo/demo-socket.js"></script>
  <script defer src="js/transport/k4-client.js"></script>
  <script defer src="js/panadapter/band-plan.js"></script>
  <script defer src="js/panadapter/color-luts.js"></script>
  <script defer src="js/panadapter/dsp.js"></script>
  <script defer src="js/panadapter/webgl-renderer.js"></script>
  <script defer src="js/panadapter/interaction.js"></script>
  <script defer src="js/panadapter/panadapter-view.js"></script>
  <script defer src="js/audio/pcm-decoder.js"></script>
  <script defer src="js/audio/opus-decoder.js"></script>
  <script defer src="js/audio/worklet-source.js"></script>
  <script defer src="js/audio/audio-engine.js"></script>
  <script defer src="js/ui/vfo-widget.js"></script>
  <script defer src="js/ui/smeter-widget.js"></script>
  <script defer src="js/ui/omnibar.js"></script>
  <script defer src="js/ui/inspector-panels.js"></script>
  <script defer src="js/ui/connection-dialog.js"></script>
  <script defer src="js/ui/settings-panel.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="app-shell">
    <header id="top-bar" role="banner">
      <div class="k4-topbar-left">
        <button type="button" id="conn-btn" class="k4-conn-pill" data-testid="conn-btn" data-status="disconnected" title="Connection settings">
          <span class="k4-status-dot" aria-hidden="true"></span>
          <span class="k4-conn-label">Disconnected</span>
          <span class="k4-conn-rtt" aria-label="Latency"></span>
        </button>

        <div id="vfo-a-mount" class="k4-vfo-slot" data-testid="vfo-a"></div>
      </div>

      <div id="vfo-cluster" class="k4-vfo-cluster" data-testid="vfo-cluster" role="group" aria-label="VFO Operations">
        <button type="button" id="vfo-ab-btn" class="k4-cluster-btn" data-testid="vfo-ab-btn" data-hold="ALL" title="Swap VFO A &amp; B frequency (Shift+Click or hold: swap all)">A/B</button>
        <button type="button" id="vfo-a2b-btn" class="k4-cluster-btn" data-testid="vfo-a2b-btn" data-hold="ALL" title="Copy VFO A to B frequency (2nd tap within 3s or Shift+Click: copy all)">A►B</button>
        <button type="button" id="vfo-split-btn" class="k4-cluster-btn" data-testid="vfo-split-btn" data-hold="+1k" aria-pressed="false" title="Toggle Split TX on VFO B (Shift+Click: Quick Split +1 kHz)">SPLIT</button>
        <button type="button" id="vfo-sub-btn" class="k4-cluster-btn" data-testid="vfo-sub-btn" aria-pressed="false" title="Toggle Sub Receiver">SUB</button>
      </div>

      <div class="k4-topbar-center">
        <div id="k4-center-icons" class="k4-center-icons" data-testid="k4-center-icons" role="group" aria-label="TX &amp; Receiver Status">
          <div class="k4-center-icons-top">
            <span class="k4-tx-vfo-ind" data-testid="k4-tx-vfo-indicator" data-state="standby">◀ TX</span>
            <button type="button" id="center-split-ind" class="k4-cicon" data-testid="center-split-ind" aria-pressed="false" title="Split TX on VFO B (Shift+Click: Quick Split +1 kHz)">SPL</button>
            <button type="button" id="center-msg-ind" class="k4-cicon" data-testid="center-msg-ind" title="Message Bank I/II (Shift+Click: open TX messages)">MSG I</button>
            <button type="button" id="center-vox-ind" class="k4-cicon" data-testid="center-vox-ind" aria-pressed="false" title="Toggle VOX for active mode">VOX</button>
            <button type="button" id="center-qsk-ind" class="k4-cicon" data-testid="center-qsk-ind" aria-pressed="false" title="Toggle CW QSK / Break-In">QSK</button>
          </div>
          <div class="k4-center-icons-bot">
            <button type="button" id="center-rit-xit-box" class="k4-rit-xit-box" data-testid="center-rit-xit-box" aria-pressed="false" title="RIT/XIT offset · Click: toggle RIT · Shift+Click: toggle XIT · Wheel: ±10/50 Hz · Dbl-click: clear">RIT +0.00</button>
            <div class="k4-top-rf-status" role="group" aria-label="Antenna and ATU Status">
              <button type="button" id="top-ant-btn" class="k4-top-pill-btn" data-testid="top-ant-btn" title="Active TX Antenna (click to cycle ANT 1 → 2 → 3)">ANT 1</button>
              <button type="button" id="top-atu-btn" class="k4-top-pill-btn" data-testid="top-atu-btn" data-state="auto" data-hold="TUNE" title="ATU Mode (click: AUTO/BYPASS · Shift+Click: ATU Tune · 2nd tap: Full Search)">ATU</button>
            </div>
          </div>
        </div>
        <div id="smeter-mount" class="k4-smeter-slot" data-testid="smeter"></div>
        <div id="vfo-b-mount" class="k4-vfo-slot k4-vfo-slot--sub" data-testid="vfo-b"></div>
      </div>

      <div class="k4-topbar-right">
        <button type="button" id="omnibar-btn" class="k4-action-btn k4-omnibar-trigger" data-testid="omnibar-btn" title="Quick jump &amp; bookmarks (Cmd/Ctrl+K)">
          <svg class="k4-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.7 10.7L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="k4-btn-label">Jump</span>
          <kbd class="k4-kbd-hint">⌘K</kbd>
        </button>

        <button type="button" id="audio-toggle" class="k4-action-btn k4-audio-btn" data-testid="audio-toggle" data-state="off" title="Start or mute receiver audio (M)">
          <svg class="k4-icon k4-audio-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M2.5 6.2H5.2L8.8 3.2V12.8L5.2 9.8H2.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path class="k4-audio-waves" d="M11 5.5C11.9 6.3 12.4 7.1 12.4 8C12.4 8.9 11.9 9.7 11 10.5M12.8 3.8C14.1 5 14.8 6.4 14.8 8C14.8 9.6 14.1 11 12.8 12.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path class="k4-audio-slash" d="M11 6L14.5 10M14.5 6L11 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="k4-audio-label">Audio Off</span>
        </button>

        <div id="tx-posture-bar" class="k4-tx-posture-bar" data-testid="tx-posture-bar" data-posture="tx-armed" role="group" aria-label="Transmit Mode &amp; Hold PTT">
          <button type="button" id="tx-mode-test" class="k4-posture-btn k4-test-switch" data-testid="tx-mode-test" aria-pressed="false" title="K4 TEST switch: toggle off-air TX Test mode (zero RF output)">TEST</button>

          <button type="button" id="ptt-btn" class="k4-ptt-btn" data-testid="ptt-btn" disabled aria-pressed="false" title="Hold to transmit (Spacebar when un-focused; releases immediately on keyup or blur)">PTT</button>
        </div>

        <button type="button" id="settings-btn" class="k4-icon-btn k4-settings-toggle" data-testid="settings-btn" aria-expanded="false" title="Settings &amp; Keyboard Shortcuts (Cmd/Ctrl+, or ?)">
          <svg class="k4-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M12.4 3.6l-1 1M4.6 11.4l-1 1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="8" cy="8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.85"/>
          </svg>
        </button>

        <button type="button" id="drawer-toggle" class="k4-icon-btn k4-drawer-toggle" data-testid="drawer-toggle" aria-expanded="true" title="Toggle Inspector Drawer">
          <svg class="k4-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <line x1="10" y1="2.5" x2="10" y2="13.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="workspace">
      <section id="pan-stage" aria-label="Spectrum Panadapter and Waterfall"></section>
      <aside id="inspector-drawer" class="k4-drawer" data-testid="inspector-drawer" data-open="true" aria-label="Receiver Inspector"></aside>
    </main>

    <nav id="mobile-nav" class="k4-mobile-nav" data-testid="mobile-nav" aria-label="Mobile Controls"></nav>
  </div>

  <section id="mobile-sheet" class="k4-mobile-sheet" data-testid="mobile-sheet" data-open="false" aria-hidden="true" aria-label="Receiver Control Sheet"></section>
  <div id="omnibar-modal" class="k4-modal-backdrop" data-testid="omnibar-modal" data-open="false" hidden></div>
  <div id="connection-dialog" class="k4-modal-backdrop" data-testid="conn-dialog" data-open="false" hidden></div>
  <div id="settings-modal" class="k4-modal-backdrop" data-testid="settings-modal" data-open="false" hidden></div>
  <div id="pwa-update-banner" class="k4-update-banner" data-testid="pwa-update-banner" hidden role="status" aria-live="polite"></div>
  <div id="toast-stack" class="k4-toast-stack" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
