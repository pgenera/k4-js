<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>K4 Web Observatory · Browser Unit Tests</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #101521;
      --border: rgba(148, 163, 184, 0.18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --pass: #10b981;
      --fail: #f43f5e;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      max-width: 960px;
      margin: 0 auto 20px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .summary {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .summary.pass { color: var(--pass); border-color: rgba(16, 185, 129, 0.45); }
    .summary.fail { color: var(--fail); border-color: rgba(244, 63, 94, 0.45); }
    #results {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 8px;
    }
    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
    }
    .test-row.is-fail {
      border-color: rgba(244, 63, 94, 0.5);
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge.pass { color: var(--pass); }
    .badge.fail { color: var(--fail); }
    .err-msg {
      margin-top: 4px;
      color: var(--fail);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>

  <!-- Exact Spec 00 Section 2 script load order (no type="module") -->
  <script defer src="js/util/events.js"></script>
  <script defer src="js/util/storage.js"></script>
  <script defer src="js/util/pwa.js"></script>
  <script defer src="js/protocol/sha384.js"></script>
  <script defer src="js/protocol/framer.js"></script>
  <script defer src="js/protocol/cat-codec.js"></script>
  <script defer src="js/protocol/binary-packets.js"></script>
  <script defer src="js/transport/rx-only-gate.js"></script>
  <script defer src="js/state/radio-state.js"></script>
  <script defer src="js/transport/k4-client.js"></script>
  <script defer src="js/panadapter/band-plan.js"></script>
  <script defer src="js/panadapter/color-luts.js"></script>
  <script defer src="js/panadapter/dsp.js"></script>
  <script defer src="js/panadapter/webgl-renderer.js"></script>
  <script defer src="js/panadapter/interaction.js"></script>
  <script defer src="js/panadapter/panadapter-view.js"></script>
  <script defer src="js/audio/pcm-decoder.js"></script>
  <script defer src="js/audio/opus-decoder.js"></script>
  <script defer src="js/audio/worklet-source.js"></script>
  <script defer src="js/audio/audio-engine.js"></script>
  <script defer src="js/ui/vfo-widget.js"></script>
  <script defer src="js/ui/smeter-widget.js"></script>
  <script defer src="js/ui/omnibar.js"></script>
  <script defer src="js/ui/inspector-panels.js"></script>
  <script defer src="js/ui/connection-dialog.js"></script>
  <script defer src="js/ui/settings-panel.js"></script>
  <script defer src="../tests/browser-unit-tests.js"></script>
</head>
<body>
  <header>
    <h1>K4 Web Observatory · Browser Unit Tests</h1>
    <div id="summary" class="summary" data-testid="test-summary">Running...</div>
  </header>
  <main id="results" data-testid="test-results"></main>
</body>
</html>
